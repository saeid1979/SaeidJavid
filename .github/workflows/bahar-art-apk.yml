name: Build BaharArt APK

on:
  push:
    branches:
      - bahar-art-apk
    paths:
      - "bahar-art-android/**"
      - ".github/workflows/bahar-art-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p bahar-art-android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp bahar-art-android/app/build/outputs/apk/debug/app-debug.apk BaharArt-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaharArt-v1.0
          path: BaharArt-v1.0.apk
          if-no-files-found: error
          retention-days: 7
