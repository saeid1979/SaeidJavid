name: Build Baharloo Art APK

on:
  push:
    branches:
      - bahar-art-apk
    paths:
      - "bahar-art-android/**"
      - ".github/workflows/bahar-art-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build unsigned release APK
        run: gradle -p bahar-art-android :app:assembleRelease --stacktrace

      - name: Rename unsigned APK
        run: cp bahar-art-android/app/build/outputs/apk/release/app-release-unsigned.apk BaharlooArt-v1.2.0-UNSIGNED.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: BaharlooArt-v1.2.0-UNSIGNED
          path: BaharlooArt-v1.2.0-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 7
