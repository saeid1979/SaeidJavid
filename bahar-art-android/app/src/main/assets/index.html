<head>

<style>
:root{--bg:#0d0d0c;--panel:#171714;--panel2:#20201c;--text:#f8f4ea;--muted:#aaa69c;--gold:#d8b66a;--line:rgba(255,255,255,.09);--safe-bottom:max(12px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:radial-gradient(circle at 70% -10%,rgba(216,182,106,.15),transparent 36%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100dvh;overflow-x:hidden}
button,select{font:inherit}button{cursor:pointer}.shell{width:100%;max-width:720px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0 18px;background:linear-gradient(to bottom,rgba(13,13,12,.99),rgba(13,13,12,.88),transparent);backdrop-filter:blur(16px)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}.mark{flex:0 0 44px;width:44px;height:44px;border-radius:15px;border:1px solid rgba(216,182,106,.45);display:grid;place-items:center;color:var(--gold);font-size:19px;font-weight:700;background:linear-gradient(145deg,#292318,#11110f)}
.brandText{min-width:0}h1{font-size:15px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topActions{display:flex;align-items:center;gap:7px}.langSelect{height:42px;min-width:72px;border-radius:13px;border:1px solid var(--line);background:#181815;color:#fff;padding:0 8px;outline:none}.icon{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#181815;color:#fff;position:relative}.badge{position:absolute;left:-4px;top:-4px;min-width:18px;height:18px;border-radius:18px;background:var(--gold);color:#111;display:grid;place-items:center;font-size:9px;font-weight:700}
.hero{min-height:380px;border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(216,182,106,.1),transparent 45%),linear-gradient(155deg,#25251f,#0e0e0c);padding:24px 20px;display:flex;align-items:end;box-shadow:0 24px 60px rgba(0,0,0,.42)}
.hero:before{content:"";position:absolute;width:230px;height:230px;left:-45px;top:-58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(216,182,106,.75),rgba(216,182,106,.06) 54%,transparent 55%);opacity:.44}.hero:after{content:"";position:absolute;width:138px;height:260px;right:8%;top:8%;border:20px solid rgba(255,255,255,.055);border-radius:45%;transform:rotate(18deg)}
.heroContent{position:relative;z-index:2}.eye{color:var(--gold);font-size:11px;margin-bottom:9px}.hero h2{font-size:clamp(29px,9vw,50px);line-height:1.12;margin:0 0 12px}.hero p{color:#d0ccc2;line-height:1.9;margin:0;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.primary,.ghost{border-radius:14px;padding:11px 14px;font-size:12px}.primary{border:0;background:var(--gold);color:#15130d;font-weight:700}.ghost{border:1px solid var(--line);background:#ffffff08;color:#fff}
.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:30px 2px 13px}.head h3{margin:0;font-size:18px}.head p{margin:4px 0 0;color:var(--muted);font-size:11px}.head button{border:0;background:transparent;color:var(--gold);font-size:11px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#151513;color:#c8c4ba;padding:8px 12px;border-radius:999px;font-size:11px}.chip.active{background:#f6f1e7;color:#111}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{min-width:0;background:linear-gradient(180deg,#191916,#131311);border:1px solid var(--line);border-radius:20px;overflow:hidden}.art{aspect-ratio:4/5;position:relative;background:#222;overflow:hidden}.art:before{content:"";position:absolute;inset:0;background:var(--art)}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.44),transparent 55%)}.like{position:absolute;left:9px;top:9px;z-index:2;width:35px;height:35px;border-radius:11px;border:1px solid #ffffff22;background:#0005;color:#fff}.like.on{color:#ff8796}.info{padding:11px}.info h4{margin:0 0 7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:9px}.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{color:var(--gold);font-weight:700;margin-top:10px;display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px}.add{border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:9px;padding:6px 8px;font-size:10px}
.videos{display:grid;grid-template-columns:1fr;gap:11px}.video{min-height:170px;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at 30% 30%,rgba(216,182,106,.2),transparent 34%),#191916;position:relative;padding:16px;display:flex;align-items:flex-end}.play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff33;background:#0005;color:#fff}.video small{color:var(--muted)}.about{margin-top:30px;border-radius:23px;border:1px solid var(--line);padding:20px;background:linear-gradient(135deg,rgba(216,182,106,.08),rgba(255,255,255,.02))}.about h3{margin:0 0 10px}.about p{color:#c8c3b8;line-height:1.95;margin:0;font-size:13px}
.nav{position:fixed;z-index:40;left:50%;bottom:var(--safe-bottom);transform:translateX(-50%);width:min(calc(100vw - 20px),620px);height:68px;border:1px solid #ffffff1f;background:#131311ec;backdrop-filter:blur(22px);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 12px 35px rgba(0,0,0,.45)}
.nav button{min-width:0;border:0;background:transparent;color:#9c988e;border-radius:15px;font-size:10px;padding:4px}.nav strong{display:block;font-size:18px;line-height:1.2;margin-bottom:2px}.nav button.active{background:#d8b66a20;color:var(--gold)}
.drawer{position:fixed;inset:0;z-index:60;background:#000a;display:none;align-items:end}.drawer.show{display:flex}.sheet{width:100%;max-height:78dvh;overflow:auto;background:#171714;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.sheetTop{display:flex;justify-content:space-between;align-items:center}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.row small{color:var(--muted)}.total{display:flex;justify-content:space-between;font-size:17px;padding:17px 0}.full{width:100%;padding:13px;border:0;border-radius:14px;background:var(--gold);font-weight:700;color:#12100b}.empty{color:var(--muted);padding:26px 0;text-align:center}.toast{position:fixed;top:72px;left:50%;transform:translate(-50%,-10px);z-index:80;background:#f5f0e5;color:#111;padding:10px 13px;border-radius:12px;opacity:0;transition:.25s;font-size:11px;max-width:88vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:359px){.grid{grid-template-columns:1fr}.hero{min-height:350px}.langSelect{min-width:64px}.mark{display:none}}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{min-height:410px}.videos{grid-template-columns:1fr 1fr}}
</style>

<body>
<div class="toast" id="toast"></div>
<main class="shell">
<header class="top">
  <div class="brand">
    <div class="mark">ب</div>
    <div class="brandText"><h1 id="artistName">محمدرضا بهارلو</h1><div class="sub" id="artistSub">هنر معاصر • آثار اورجینال</div></div>
  </div>
  <div class="topActions">
    <select id="lang" class="langSelect" aria-label="Language">
      <option value="fa">FA</option><option value="es">ES</option><option value="en">EN</option><option value="tr">TR</option>
    </select>
    <button class="icon" onclick="openCart()">👜<span class="badge" id="badge">۰</span></button>
  </div>
</header>

<section class="hero" id="home"><div class="heroContent">
  <div class="eye" id="heroEye"></div>
  <h2 id="heroTitle"></h2>
  <p id="heroText"></p>
  <div class="actions"><button class="primary" id="seeWorks" onclick="goTo('gallery')"></button><button class="ghost" id="aboutArtistBtn" onclick="goTo('about')"></button></div>
</div></section>

<div class="head" id="gallery"><div><h3 id="worksTitle"></h3><p id="worksSub"></p></div><button id="showAll" onclick="setFilter('all')"></button></div>
<div class="filters" id="filters"></div>
<section class="grid" id="grid"></section>

<div class="head" id="videos"><div><h3 id="videosTitle"></h3><p id="videosSub"></p></div></div>
<section class="videos">
  <article class="video"><button class="play" onclick="toast(t().sampleVideo)">▶</button><div><b id="video1Title"></b><br><small id="video1Sub"></small></div></article>
  <article class="video"><button class="play" onclick="toast(t().sampleVideo)">▶</button><div><b id="video2Title"></b><br><small id="video2Sub"></small></div></article>
</section>

<section class="about" id="about"><h3 id="aboutTitle"></h3><p id="aboutText"></p></section>
</main>

<nav class="nav">
  <button class="active" onclick="tab('home',this)"><strong>⌂</strong><span id="navHome"></span></button>
  <button onclick="tab('gallery',this)"><strong>▦</strong><span id="navWorks"></span></button>
  <button onclick="tab('videos',this)"><strong>▷</strong><span id="navVideos"></span></button>
  <button onclick="tab('about',this)"><strong>◌</strong><span id="navAbout"></span></button>
</nav>

<div class="drawer" id="drawer" onclick="if(event.target===this)closeCart()"><div class="sheet">
  <div class="sheetTop"><h3 id="cartTitle"></h3><button class="icon" onclick="closeCart()">✕</button></div>
  <div id="items"></div>
  <div class="total"><span id="totalLabel"></span><b id="total">۰ €</b></div>
  <button class="full" id="orderBtn" onclick="order()"></button>
</div></div>

const I18N={

en:{dir:'ltr',artist:'Mohammad Reza Baharloo',sub:'Contemporary art • Original works',heroEye:'● Private artist gallery',heroTitle:'Every artwork carries part of a story.',heroText:'A curated selection of works by Mohammad Reza Baharloo, including paintings and limited collections with details, favorites and direct ordering.',seeWorks:'View artworks',aboutArtist:'About the artist',works:'Selected artworks',worksSub:'Available collections',showAll:'View all',videos:'Studio videos',videosSub:'Behind the creative process',v1:'From idea to canvas',v1s:'The process of creating a new artwork',v2:'Inside the studio',v2s:'A short look at the workspace',about:'Mohammad Reza Baharloo',aboutText:'This section introduces the artist, his style, exhibitions and the story behind each collection. Real photos, videos, descriptions and prices can be added in the next version.',home:'Home',worksNav:'Artworks',videosNav:'Videos',aboutNav:'About',cart:'Cart',total:'Total',order:'Order via WhatsApp',empty:'Your cart is empty.',remove:'Remove',add:'Add',added:'Added to cart',selectFirst:'Choose an artwork first',sampleVideo:'Sample video. The artist’s original video will be added in the next version.',categories:{all:'All',painting:'Painting',urban:'Urban collection',nature:'Nature collection'},orderHello:'Hello, I would like to order these artworks:',contact:'Name and phone:',products:['Golden Silence','Rainy Street','Blue Memory','Roots','Bright Window','Pulse of Earth','Passage','Midnight']},
tr:{dir:'ltr',artist:'Mohammad Reza Baharloo',sub:'Çağdaş sanat • Orijinal eserler',heroEye:'● Sanatçının özel galerisi',heroTitle:'Her eser bir hikâyenin parçasını taşır.',heroText:'Mohammad Reza Baharloo’nun seçilmiş eserleri; resimler ve sınırlı koleksiyonlar, ayrıntılar, favoriler ve doğrudan sipariş imkânıyla.',seeWorks:'Eserleri gör',aboutArtist:'Sanatçı hakkında',works:'Seçili eserler',worksSub:'Sipariş verilebilir koleksiyonlar',showAll:'Tümünü göster',videos:'Stüdyo videoları',videosSub:'Yaratım sürecinin perde arkası',v1:'Fikirden tuvale',v1s:'Yeni bir eserin yaratım süreci',v2:'Stüdyonun içinde',v2s:'Çalışma alanına kısa bir bakış',about:'Mohammad Reza Baharloo',aboutText:'Bu bölüm sanatçıyı, çalışma tarzını, sergilerini ve her koleksiyonun hikâyesini tanıtır. Gerçek fotoğraflar, videolar, açıklamalar ve fiyatlar sonraki sürümde eklenebilir.',home:'Ana sayfa',worksNav:'Eserler',videosNav:'Videolar',aboutNav:'Hakkında',cart:'Sepet',total:'Toplam',order:'WhatsApp ile sipariş',empty:'Sepetiniz boş.',remove:'Sil',add:'Ekle',added:'Sepete eklendi',selectFirst:'Önce bir eser seçin',sampleVideo:'Örnek video. Sanatçının gerçek videosu sonraki sürümde eklenecek.',categories:{all:'Tümü',painting:'Resim',urban:'Şehir koleksiyonu',nature:'Doğa koleksiyonu'},orderHello:'Merhaba, bu eserleri sipariş etmek istiyorum:',contact:'Ad ve telefon:',products:['Altın Sessizlik','Yağmurlu Sokak','Mavi Hatıra','Kökler','Aydınlık Pencere','Toprağın Nabzı','Geçiş','Gece Yarısı']}
};

const products=[
{id:1,cat:'painting',size:'70 × 50 cm',price:420,art:'radial-gradient(circle at 28% 28%,#dec27e 0 8%,transparent 9%),linear-gradient(145deg,#201a12 0 38%,#a7874a 39% 42%,#e0d4b2 43% 47%,#2b2923 48% 100%)'},
{id:2,cat:'urban',size:'80 × 60 cm',price:560,art:'linear-gradient(120deg,#161a20 0 28%,#6d7780 29% 34%,#cbbd98 35% 39%,#2e3339 40% 62%,#9a7a4d 63% 66%,#111318 67%)'},
{id:3,cat:'painting',size:'60 × 60 cm',price:390,art:'radial-gradient(circle at 68% 35%,#b0c6c9 0 12%,transparent 13%),linear-gradient(160deg,#132026,#27505a 45%,#c0aa72 46% 50%,#0d1518 51%)'},
{id:4,cat:'nature',size:'90 × 70 cm',price:680,art:'repeating-linear-gradient(105deg,#1c1711 0 13px,#33281b 14px 28px,#8a714a 29px 34px,#17130f 35px 51px)'},
{id:5,cat:'urban',size:'50 × 40 cm',price:320,art:'linear-gradient(90deg,#111 0 25%,#c7a969 26% 32%,#282622 33% 61%,#f0deae 62% 69%,#151515 70%)'},
{id:6,cat:'nature',size:'75 × 55 cm',price:510,art:'radial-gradient(ellipse at 50% 70%,#99754a 0 14%,#382a1c 15% 28%,transparent 29%),linear-gradient(150deg,#17130f,#5b4a30 48%,#17130f)'},
{id:7,cat:'painting',size:'65 × 45 cm',price:450,art:'linear-gradient(132deg,#dad2be 0 16%,#35302a 17% 39%,#b1935d 40% 43%,#181716 44% 67%,#70685a 68%)'},
{id:8,cat:'urban',size:'100 × 70 cm',price:790,art:'radial-gradient(circle at 65% 30%,#c8a861 0 4%,transparent 5%),linear-gradient(180deg,#0a0e15,#162438 55%,#090b10 56%)'}
];

let lang=localStorage.getItem('bahar_lang')||'fa';
let filter='all';
let cart=JSON.parse(localStorage.getItem('bahar_cart')||'[]');
let likes=JSON.parse(localStorage.getItem('bahar_likes')||'[]');
const t=()=>I18N[lang];
const fmt=n=>new Intl.NumberFormat(lang==='fa'?'fa-IR':lang==='tr'?'tr-TR':lang==='es'?'es-ES':'en-US').format(n);

function applyLanguage(){
 document.documentElement.lang=lang;
 document.documentElement.dir=t().dir;
 document.getElementById('lang').value=lang;
 document.title=t().artist+' | '+t().works;
 const ids={artistName:'artist',artistSub:'sub',heroEye:'heroEye',heroTitle:'heroTitle',heroText:'heroText',seeWorks:'seeWorks',aboutArtistBtn:'aboutArtist',worksTitle:'works',worksSub:'worksSub',showAll:'showAll',videosTitle:'videos',videosSub:'videosSub',video1Title:'v1',video1Sub:'v1s',video2Title:'v2',video2Sub:'v2s',aboutTitle:'about',aboutText:'aboutText',navHome:'home',navWorks:'worksNav',navVideos:'videosNav',navAbout:'aboutNav',cartTitle:'cart',totalLabel:'total',orderBtn:'order'};
 Object.entries(ids).forEach(([id,key])=>document.getElementById(id).textContent=t()[key]);
 renderFilters();render();update();if(document.getElementById('drawer').classList.contains('show'))renderCart();
}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('bahar_lang',lang);applyLanguage()});

function renderFilters(){
 const cats=['all','painting','urban','nature'];
 document.getElementById('filters').innerHTML=cats.map(c=>'<button class="chip '+(c===filter?'active':'')+'" onclick="setFilter(\''+c+'\')">'+t().categories[c]+'</button>').join('');
}
function render(){
 const list=filter==='all'?products:products.filter(p=>p.cat===filter);
 document.getElementById('grid').innerHTML=list.map(p=>'<article class="card"><div class="art" style="--art:'+p.art+'"><button class="like '+(likes.includes(p.id)?'on':'')+'" onclick="like('+p.id+')">♥</button></div><div class="info"><h4>'+t().products[p.id-1]+'</h4><div class="meta"><span>'+t().categories[p.cat]+'</span><span>'+p.size+'</span></div><div class="price"><span>'+fmt(p.price)+' €</span><button class="add" onclick="add('+p.id+')">+ '+t().add+'</button></div></div></article>').join('');
}
function setFilter(c){filter=c;renderFilters();render()}
function like(id){likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];localStorage.setItem('bahar_likes',JSON.stringify(likes));render()}
function add(id){if(!cart.includes(id))cart.push(id);localStorage.setItem('bahar_cart',JSON.stringify(cart));update();toast(t().added)}
function removeItem(id){cart=cart.filter(x=>x!==id);localStorage.setItem('bahar_cart',JSON.stringify(cart));update();renderCart()}
function update(){document.getElementById('badge').textContent=fmt(cart.length)}
function renderCart(){
 const ps=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);
 document.getElementById('items').innerHTML=ps.length?ps.map(p=>'<div class="row"><div><b>'+t().products[p.id-1]+'</b><br><small>'+t().categories[p.cat]+' • '+p.size+'</small></div><div><b>'+fmt(p.price)+' €</b><br><button class="chip" style="padding:6px 9px;margin-top:6px" onclick="removeItem('+p.id+')">'+t().remove+'</button></div></div>').join(''):'<div class="empty">'+t().empty+'</div>';
 document.getElementById('total').textContent=fmt(ps.reduce((s,p)=>s+p.price,0))+' €';
}
function openCart(){renderCart();document.getElementById('drawer').classList.add('show')}
function closeCart(){document.getElementById('drawer').classList.remove('show')}
function order(){
 const ps=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);
 if(!ps.length){toast(t().selectFirst);return}
 const txt=t().orderHello+'\n'+ps.map(p=>'• '+t().products[p.id-1]+' - '+p.price+'€').join('\n')+'\n\n'+t().contact;
 location.href='https://wa.me/?text='+encodeURIComponent(txt);
}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function goTo(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}
function tab(id,b){goTo(id);document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}

applyLanguage();
</script>
</body>
