<div class="toast" id="toast"></div>
<main class="shell">

</section>

<section id="favorites" class="sectionHidden">
  <div class="head"><div><h3 id="favTitle"></h3><p id="favSub"></p></div></div>
  <div class="grid" id="favGrid"></div>
</section>

<section id="videos">
  <div class="head"><div><h3 id="videosTitle"></h3><p id="videosSub"></p></div></div>

    <article class="video"><button class="play" onclick="toast(t().sampleVideo)">▶</button><div><b id="video1Title"></b><br><small id="video1Sub"></small></div></article>

  </div>
</section>

<section class="about" id="about"><h3 id="aboutTitle"></h3><p id="aboutText"></p>
  <div class="contactRow"><button class="contactBtn" id="shareArtist" onclick="shareArtist()"></button><button class="contactBtn" id="contactArtist" onclick="contactArtist()"></button></div>
</section>
</main>

<nav class="nav">
  <button class="active" data-target="home" onclick="navTo('home',this)"><strong>⌂</strong><span id="navHome"></span></button>
  <button data-target="gallery" onclick="navTo('gallery',this)"><strong>▦</strong><span id="navWorks"></span></button>

</nav>

{id:8,cat:'urban',size:'100 × 70 cm',price:790,art:'radial-gradient(circle at 65% 30%,#c8a861 0 4%,transparent 5%),linear-gradient(180deg,#0a0e15,#162438 55%,#090b10 56%)'}
];

let lang=localStorage.getItem('bahar_lang')||'fa',filter='all',current=null;
let cart=JSON.parse(localStorage.getItem('bahar_cart')||'[]');
let likes=JSON.parse(localStorage.getItem('bahar_likes')||'[]');
const t=()=>I18N[lang];
const fmt=n=>new Intl.NumberFormat(lang==='fa'?'fa-IR':lang==='tr'?'tr-TR':lang==='es'?'es-ES':'en-US').format(n);

function card(p){
 return '<article class="card"><div class="art" style="--art:'+p.art+'" onclick="openDetail('+p.id+')"><button class="like '+(likes.includes(p.id)?'on':'')+'" onclick="event.stopPropagation();like('+p.id+')">♥</button><span class="sample">'+t().sample+'</span></div><div class="info"><h4 onclick="openDetail('+p.id+')">'+t().products[p.id-1]+'</h4><div class="meta"><span>'+t().categories[p.cat]+'</span><span>'+p.size+'</span></div><div class="price"><span>'+fmt(p.price)+' €</span><button class="add" onclick="add('+p.id+')">+ '+t().add+'</button></div></div></article>';
}
function applyLanguage(){
 document.documentElement.lang=lang;document.documentElement.dir=t().dir;document.getElementById('lang').value=lang;document.title=t().artist+' | '+t().works;
 const map={artistName:'artist',artistSub:'sub',heroEye:'heroEye',heroTitle:'heroTitle',heroText:'heroText',seeWorks:'seeWorks',aboutArtistBtn:'aboutArtist',worksTitle:'works',worksSub:'worksSub',showAll:'showAll',favTitle:'favorites',favSub:'favSub',videosTitle:'videos',videosSub:'videosSub',video1Title:'v1',video1Sub:'v1s',video2Title:'v2',video2Sub:'v2s',aboutTitle:'about',aboutText:'aboutText',navHome:'home',navWorks:'worksNav',navFav:'favNav',navVideos:'videosNav',navAbout:'aboutNav',cartTitle:'cart',totalLabel:'total',orderBtn:'order',shareArtist:'shareArtist',contactArtist:'contactArtist'};
 Object.entries(map).forEach(([id,key])=>document.getElementById(id).textContent=t()[key]);
 document.getElementById('search').placeholder=t().search;renderFilters();render();renderFavorites();updateCart();
 if(current)fillDetail();if(document.getElementById('cartOverlay').classList.contains('show'))renderCart();
}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('bahar_lang',lang);applyLanguage()});

function renderFilters(){document.getElementById('filters').innerHTML=['all','painting','urban','nature'].map(c=>'<button class="chip '+(filter===c?'active':'')+'" onclick="setFilter(\''+c+'\')">'+t().categories[c]+'</button>').join('')}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const list=products.filter(p=>(filter==='all'||p.cat===filter)&&(!q||t().products[p.id-1].toLowerCase().includes(q)||t().categories[p.cat].toLowerCase().includes(q)));
 document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1">'+t().emptyFav+'</div>';
}
function renderFavorites(){
 const list=products.filter(p=>likes.includes(p.id));
 document.getElementById('favGrid').innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1">'+t().emptyFav+'</div>';
}
function setFilter(c){filter=c;renderFilters();render()}
function like(id){likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];localStorage.setItem('bahar_likes',JSON.stringify(likes));render();renderFavorites();if(current&&current.id===id)fillDetail()}
function add(id){if(!cart.includes(id))cart.push(id);localStorage.setItem('bahar_cart',JSON.stringify(cart));updateCart();toast(t().added)}
function updateCart(){document.getElementById('badge').textContent=fmt(cart.length)}
function removeItem(id){cart=cart.filter(x=>x!==id);localStorage.setItem('bahar_cart',JSON.stringify(cart));updateCart();renderCart()}
function renderCart(){
 const ps=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);
 document.getElementById('items').innerHTML=ps.length?ps.map(p=>'<div class="row"><div><b>'+t().products[p.id-1]+'</b><br><small>'+t().categories[p.cat]+' • '+p.size+'</small></div><div><b>'+fmt(p.price)+' €</b><br><button class="chip" style="padding:6px 9px;margin-top:6px" onclick="removeItem('+p.id+')">'+t().remove+'</button></div></div>').join(''):'<div class="empty">'+t().empty+'</div>';
 document.getElementById('total').textContent=fmt(ps.reduce((s,p)=>s+p.price,0))+' €';
}
function openCart(){renderCart();document.getElementById('cartOverlay').classList.add('show')}function closeCart(){document.getElementById('cartOverlay').classList.remove('show')}

function openDetail(id){current=products.find(p=>p.id===id);fillDetail();document.getElementById('detailOverlay').classList.add('show')}
function fillDetail(){if(!current)return;document.getElementById('detailTitle').textContent=t().products[current.id-1];document.getElementById('detailArt').style.setProperty('--art',current.art);document.getElementById('detailMeta').innerHTML='<span class="pill">'+t().categories[current.cat]+'</span><span class="pill">'+current.size+'</span><span class="pill">'+fmt(current.price)+' €</span><span class="pill">'+t().sample+'</span>';document.getElementById('detailDesc').textContent=t().desc;document.getElementById('detailAdd').textContent='+ '+t().add;document.getElementById('detailShare').textContent=t().share;document.getElementById('detailOrder').textContent=t().orderNow}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('show')}
function detailAdd(){if(current)add(current.id)}
function orderCurrent(){if(!current)return;const msg=t().singleHello+'\n• '+t().products[current.id-1]+' - '+current.price+'€\n\n'+t().contact;location.href='https://wa.me/?text='+encodeURIComponent(msg)}
function orderCart(){const ps=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);if(!ps.length){toast(t().selectFirst);return}const msg=t().orderHello+'\n'+ps.map(p=>'• '+t().products[p.id-1]+' - '+p.price+'€').join('\n')+'\n\n'+t().contact;location.href='https://wa.me/?text='+encodeURIComponent(msg)}
function shareText(text,title){if(navigator.share){navigator.share({title:title,text:text}).catch(()=>{})}else{try{navigator.clipboard.writeText(text);toast(t().copied)}catch(e){toast(t().copied)}}}
function shareCurrent(){if(!current)return;shareText(t().products[current.id-1]+' • '+current.size+' • '+current.price+'€',t().artist)}
function shareArtist(){shareText(t().artist+' — '+t().sub,t().artist)}
function contactArtist(){location.href='https://wa.me/?text='+encodeURIComponent(t().singleHello+'\n'+t().contact)}

function showSection(id){navTo(id,[...document.querySelectorAll('.nav button')].find(b=>b.dataset.target===id)||document.querySelector('.nav button'))}
function navTo(id,b){
 document.getElementById('favorites').classList.toggle('sectionHidden',id!=='favorites');
 if(id==='favorites'){renderFavorites();document.getElementById('favorites').scrollIntoView({behavior:'smooth',block:'start'})}
 else{document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')
}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2100)}
applyLanguage();
</script>
</body></html>
