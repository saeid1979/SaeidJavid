<body>
<div class="toast" id="toast"></div>
<main class="shell">
<header class="top">
  <div class="brand"><div class="mark">ب</div><div class="brandText"><h1 id="artistName"></h1><div class="sub" id="artistSub"></div></div></div>
  <div class="topActions">
    <select id="lang" class="lang"><option value="fa">FA</option><option value="es">ES</option><option value="en">EN</option><option value="tr">TR</option></select>
    <button class="icon" onclick="openAdmin()">⚙</button>
    <button class="icon" onclick="openCart()">👜<span class="badge" id="badge">0</span></button>
  </div>
</header>

<div class="searchWrap"><span class="searchIcon">⌕</span><input id="search" class="search" type="search" oninput="render()" /></div>

<section class="hero" id="home"><div class="heroContent">
  <div class="eye" id="heroEye"></div><h2 id="heroTitle"></h2><p id="heroText"></p>
  <div class="actions"><button class="primary" id="seeWorks" onclick="showSection('gallery')"></button><button class="ghost" id="aboutArtistBtn" onclick="showSection('about')"></button></div>
</div></section>

<section id="gallery">
  <div class="head"><div><h3 id="worksTitle"></h3><p id="worksSub"></p></div><button id="showAll" onclick="setFilter('all')"></button></div>
  <div class="filters" id="filters"></div><div class="grid" id="grid"></div>
</section>

<section id="favorites" class="sectionHidden">
  <div class="head"><div><h3 id="favTitle"></h3><p id="favSub"></p></div></div><div class="grid" id="favGrid"></div>
</section>

<section id="videos">
  <div class="head"><div><h3 id="videosTitle"></h3><p id="videosSub"></p></div></div>
  <div class="videos">
    <article class="video"><button class="play" onclick="toast(t().sampleVideo)">▶</button><div><b id="video1Title"></b><br><small id="video1Sub"></small></div></article>
    <article class="video"><button class="play" onclick="toast(t().sampleVideo)">▶</button><div><b id="video2Title"></b><br><small id="video2Sub"></small></div></article>
  </div>
</section>

<section class="about" id="about"><h3 id="aboutTitle"></h3><p id="aboutText"></p>
  <div class="contactRow"><button class="contactBtn" id="shareArtist" onclick="shareArtist()"></button><button class="contactBtn" id="contactArtist" onclick="contactArtist()"></button></div>
</section>
</main>

<nav class="nav">
  <button class="active" data-target="home" onclick="navTo('home',this)"><strong>⌂</strong><span id="navHome"></span></button>
  <button data-target="gallery" onclick="navTo('gallery',this)"><strong>▦</strong><span id="navWorks"></span></button>
  <button data-target="favorites" onclick="navTo('favorites',this)"><strong>♥</strong><span id="navFav"></span></button>
  <button data-target="videos" onclick="navTo('videos',this)"><strong>▷</strong><span id="navVideos"></span></button>
  <button data-target="about" onclick="navTo('about',this)"><strong>◌</strong><span id="navAbout"></span></button>
</nav>

<div class="overlay" id="cartOverlay" onclick="if(event.target===this)closeCart()"><div class="sheet">
  <div class="sheetTop"><h3 id="cartTitle"></h3><button class="icon" onclick="closeCart()">✕</button></div><div id="items"></div>
  <div class="total"><span id="totalLabel"></span><b id="total"></b></div><button class="full" id="orderBtn" onclick="orderCart()"></button>
</div></div>

<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()"><div class="sheet">
  <div class="sheetTop"><h3 id="detailTitle"></h3><button class="icon" onclick="closeDetail()">✕</button></div>
  <div id="detailArt" class="detailArt"></div><div class="detailMedia" id="detailMedia"></div>
  <div class="detailMeta" id="detailMeta"></div><p class="detailDesc" id="detailDesc"></p>
  <div class="detailActions"><button class="primary" id="detailAdd" onclick="detailAdd()"></button><button class="ghost" id="detailShare" onclick="shareCurrent()"></button></div>
  <button class="full" style="margin-top:8px" id="detailOrder" onclick="orderCurrent()"></button>
</div></div>

<div class="overlay" id="adminOverlay" onclick="if(event.target===this)closeAdmin()"><div class="sheet">
  <div class="sheetTop"><h3 id="adminTitle"></h3><button class="icon" onclick="closeAdmin()">✕</button></div><div id="adminBody"></div>
</div></div>

let lang=localStorage.getItem('bahar_lang')||'fa',filter='all',current=null,adminLogged=false,editingId=null;
let cart=JSON.parse(localStorage.getItem('bahar_cart')||'[]');
let likes=JSON.parse(localStorage.getItem('bahar_likes')||'[]');
let customProducts=JSON.parse(localStorage.getItem('bahar_custom_products')||'[]');
let mediaUrls=[];
const t=()=>I18N[lang];
const fmt=n=>new Intl.NumberFormat(lang==='fa'?'fa-IR':lang==='tr'?'tr-TR':lang==='es'?'es-ES':'en-US').format(Number(n)||0);
const allProducts=()=>[...baseProducts,...customProducts];

function titleOf(p){if(p.base)return t().products[p.id-1];return (p.titles&&p.titles[lang])||(p.titles&&p.titles.en)||(p.titles&&p.titles.fa)||'Artwork'}
function descOf(p){if(p.base)return t().desc;return (p.descriptions&&p.descriptions[lang])||(p.descriptions&&p.descriptions.en)||(p.descriptions&&p.descriptions.fa)||''}
function statusLabel(s){return t()[s]||s}
function pinHash(x){let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619)}return String(h>>>0)}

function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('BaharlooArtDB',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function putMedia(key,file){if(!file)return;const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put({key,blob:file,type:file.type,name:file.name});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function getMedia(key){if(!key)return null;const db=await openDb();const v=await new Promise((resolve,reject)=>{const tx=db.transaction('media','readonly');const q=tx.objectStore('media').get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)});db.close();return v}
async function deleteMedia(key){if(!key)return;const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
function clearMediaUrls(){mediaUrls.forEach(u=>URL.revokeObjectURL(u));mediaUrls=[]}
async function hydrateMedia(root=document){const els=[...root.querySelectorAll('[data-image-key]')];for(const el of els){const rec=await getMedia(el.dataset.imageKey);if(rec&&rec.blob){const u=URL.createObjectURL(rec.blob);mediaUrls.push(u);el.style.backgroundImage='url("'+u+'")';el.classList.add('hasMedia')}}}

function card(p){
 const imageAttr=p.imageKey?' data-image-key="'+p.imageKey+'"':'';
 const artStyle=p.base?' style="--art:'+p.art+'"':'';
 const sold=p.status==='sold';
 return '<article class="card"><div class="art"'+imageAttr+artStyle+' onclick="openDetail(\''+p.id+'\')"><button class="like '+(likes.includes(p.id)?'on':'')+'" onclick="event.stopPropagation();like(\''+p.id+'\')">♥</button><span class="statusTag status-'+(p.status||'available')+'">'+statusLabel(p.status||'available')+'</span>'+(p.base?'<span class="tag">'+t().sample+'</span>':'')+'</div><div class="info"><h4 onclick="openDetail(\''+p.id+'\')">'+titleOf(p)+'</h4><div class="meta"><span>'+t().categories[p.cat]+'</span><span>'+p.size+'</span></div><div class="price"><span>'+fmt(p.price)+' €</span><button class="add" '+(sold?'disabled':'')+' onclick="add(\''+p.id+'\')">+ '+t().add+'</button></div></div></article>';
}

async function render(){
 clearMediaUrls();
 const q=document.getElementById('search').value.trim().toLowerCase();
 const list=allProducts().filter(p=>(filter==='all'||p.cat===filter)&&(!q||titleOf(p).toLowerCase().includes(q)||t().categories[p.cat].toLowerCase().includes(q)));
 const grid=document.getElementById('grid');grid.innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1">'+t().emptyFav+'</div>';
 await hydrateMedia(grid);renderFavorites();
}
async function renderFavorites(){
 const list=allProducts().filter(p=>likes.includes(p.id));
 const root=document.getElementById('favGrid');root.innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1">'+t().emptyFav+'</div>';await hydrateMedia(root)
}
function renderFilters(){document.getElementById('filters').innerHTML=['all','painting','urban','nature','other'].map(c=>'<button class="chip '+(filter===c?'active':'')+'" onclick="setFilter(\''+c+'\')">'+t().categories[c]+'</button>').join('')}
function setFilter(c){filter=c;renderFilters();render()}

function applyLanguage(){
 document.documentElement.lang=lang;document.documentElement.dir=t().dir;document.getElementById('lang').value=lang;document.title=t().artist+' | '+t().works;
 const map={artistName:'artist',artistSub:'sub',heroEye:'heroEye',heroTitle:'heroTitle',heroText:'heroText',seeWorks:'seeWorks',aboutArtistBtn:'aboutArtist',worksTitle:'works',worksSub:'worksSub',showAll:'showAll',favTitle:'favorites',favSub:'favSub',videosTitle:'videos',videosSub:'videosSub',video1Title:'v1',video1Sub:'v1s',video2Title:'v2',video2Sub:'v2s',aboutTitle:'about',aboutText:'aboutText',navHome:'home',navWorks:'worksNav',navFav:'favNav',navVideos:'videosNav',navAbout:'aboutNav',cartTitle:'cart',totalLabel:'total',orderBtn:'order',shareArtist:'shareArtist',contactArtist:'contactArtist',adminTitle:'admin'};
 Object.entries(map).forEach(([id,key])=>{const e=document.getElementById(id);if(e)e.textContent=t()[key]});
 document.getElementById('search').placeholder=t().search;renderFilters();render();updateCart();if(current)fillDetail();if(document.getElementById('cartOverlay').classList.contains('show'))renderCart();if(document.getElementById('adminOverlay').classList.contains('show'))renderAdmin()
}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('bahar_lang',lang);applyLanguage()});

function like(id){const val=allProducts().find(p=>String(p.id)===String(id))?.id||id;likes=likes.includes(val)?likes.filter(x=>x!==val):[...likes,val];localStorage.setItem('bahar_likes',JSON.stringify(likes));render()}
function add(id){const p=allProducts().find(x=>String(x.id)===String(id));if(!p||p.status==='sold')return;if(!cart.includes(p.id))cart.push(p.id);localStorage.setItem('bahar_cart',JSON.stringify(cart));updateCart();toast(t().added)}
function updateCart(){document.getElementById('badge').textContent=fmt(cart.length)}
function removeItem(id){cart=cart.filter(x=>String(x)!==String(id));localStorage.setItem('bahar_cart',JSON.stringify(cart));updateCart();renderCart()}
function renderCart(){const ps=cart.map(id=>allProducts().find(p=>String(p.id)===String(id))).filter(Boolean);document.getElementById('items').innerHTML=ps.length?ps.map(p=>'<div class="row"><div><b>'+titleOf(p)+'</b><br><small>'+t().categories[p.cat]+' • '+p.size+'</small></div><div><b>'+fmt(p.price)+' €</b><br><button class="chip" style="padding:6px 9px;margin-top:6px" onclick="removeItem(\''+p.id+'\')">'+t().remove+'</button></div></div>').join(''):'<div class="empty">'+t().empty+'</div>';document.getElementById('total').textContent=fmt(ps.reduce((s,p)=>s+Number(p.price||0),0))+' €'}
function openCart(){renderCart();document.getElementById('cartOverlay').classList.add('show')}function closeCart(){document.getElementById('cartOverlay').classList.remove('show')}

async function openDetail(id){current=allProducts().find(p=>String(p.id)===String(id));if(!current)return;await fillDetail();document.getElementById('detailOverlay').classList.add('show')}
async function fillDetail(){if(!current)return;document.getElementById('detailTitle').textContent=titleOf(current);const art=document.getElementById('detailArt');art.style.backgroundImage='';art.style.setProperty('--art',current.base?current.art:'#222');if(current.imageKey){const rec=await getMedia(current.imageKey);if(rec&&rec.blob){const u=URL.createObjectURL(rec.blob);mediaUrls.push(u);art.style.backgroundImage='url("'+u+'")'}}const bits=['<span class="pill">'+t().categories[current.cat]+'</span>','<span class="pill">'+current.size+'</span>','<span class="pill">'+fmt(current.price)+' €</span>','<span class="pill">'+statusLabel(current.status||'available')+'</span>'];if(current.year)bits.push('<span class="pill">'+t().year+': '+current.year+'</span>');if(current.technique)bits.push('<span class="pill">'+t().technique+': '+current.technique+'</span>');document.getElementById('detailMeta').innerHTML=bits.join('');document.getElementById('detailDesc').textContent=descOf(current);document.getElementById('detailAdd').textContent='+ '+t().add;document.getElementById('detailShare').textContent=t().share;document.getElementById('detailOrder').textContent=t().orderNow;document.getElementById('detailAdd').disabled=current.status==='sold';document.getElementById('detailOrder').disabled=current.status==='sold';const dm=document.getElementById('detailMedia');dm.innerHTML='';if(current.videoKey){const v=await getMedia(current.videoKey);if(v&&v.blob){const u=URL.createObjectURL(v.blob);mediaUrls.push(u);dm.innerHTML='<video controls playsinline src="'+u+'"></video>'}}}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('show')}
function detailAdd(){if(current)add(current.id)}
function orderCurrent(){if(!current||current.status==='sold')return;const msg=t().singleHello+'\n• '+titleOf(current)+' - '+current.price+'€\n\n'+t().contact;location.href='https://wa.me/?text='+encodeURIComponent(msg)}
function orderCart(){const ps=cart.map(id=>allProducts().find(p=>String(p.id)===String(id))).filter(Boolean);if(!ps.length){toast(t().selectFirst);return}const msg=t().orderHello+'\n'+ps.map(p=>'• '+titleOf(p)+' - '+p.price+'€').join('\n')+'\n\n'+t().contact;location.href='https://wa.me/?text='+encodeURIComponent(msg)}
function shareText(text,title){if(navigator.share){navigator.share({title,text}).catch(()=>{})}else{try{navigator.clipboard.writeText(text);toast(t().copied)}catch(e){toast(t().copied)}}}
function shareCurrent(){if(current)shareText(titleOf(current)+' • '+current.size+' • '+current.price+'€',t().artist)}
function shareArtist(){shareText(t().artist+' — '+t().sub,t().artist)}
function contactArtist(){location.href='https://wa.me/?text='+encodeURIComponent(t().singleHello+'\n'+t().contact)}
function showSection(id){navTo(id,[...document.querySelectorAll('.nav button')].find(b=>b.dataset.target===id)||document.querySelector('.nav button'))}
function navTo(id,b){document.getElementById('favorites').classList.toggle('sectionHidden',id!=='favorites');if(id==='favorites'){renderFavorites();document.getElementById('favorites').scrollIntoView({behavior:'smooth',block:'start'})}else document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}

function openAdmin(){document.getElementById('adminOverlay').classList.add('show');renderAdmin()}
function closeAdmin(){document.getElementById('adminOverlay').classList.remove('show');editingId=null}
function renderAdmin(){
 const body=document.getElementById('adminBody'),hash=localStorage.getItem('bahar_admin_pin');
 if(!hash){body.innerHTML='<div class="adminLogin"><h3>'+t().adminCreate+'</h3><p class="help">'+t().pinHelp+'</p><input id="pinSetup" class="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="'+t().pinPlaceholder+'"><div style="margin-top:12px"><button class="primary" onclick="setupPin()">'+t().savePin+'</button></div></div>';return}
 if(!adminLogged){body.innerHTML='<div class="adminLogin"><h3>'+t().adminLogin+'</h3><input id="pinLogin" class="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="'+t().pinPlaceholder+'"><div style="margin-top:12px"><button class="primary" onclick="loginAdmin()">'+t().enter+'</button></div></div>';return}
 if(editingId!==null){renderAdminForm();return}
 const items=customProducts.length?customProducts.map(p=>'<div class="adminItem"><div><b>'+titleOf(p)+'</b><br><small>'+t().categories[p.cat]+' • '+p.size+' • '+fmt(p.price)+'€ • '+statusLabel(p.status)+'</small></div><div class="adminBtns"><button onclick="editWork(\''+p.id+'\')">'+t().edit+'</button><button onclick="deleteWork(\''+p.id+'\')">'+t().delete+'</button></div></div>').join(''):'<div class="empty">'+t().noCustom+'</div>';
 body.innerHTML='<div class="adminToolbar"><button class="primary" onclick="newWork()">'+t().addWork+'</button><button class="ghost" onclick="logoutAdmin()">'+t().logout+'</button></div><h4>'+t().manageWorks+'</h4><div class="adminList">'+items+'</div><div class="adminToolbar" style="margin-top:16px"><button class="ghost" onclick="showChangePin()">'+t().changePin+'</button><span></span></div><p class="help">'+t().mediaHint+'</p>';
}
function setupPin(){const v=(document.getElementById('pinSetup').value||'').replace(/\D/g,'');if(v.length<4||v.length>8){toast(t().pinHelp);return}localStorage.setItem('bahar_admin_pin',pinHash(v));adminLogged=true;renderAdmin()}
function loginAdmin(){const v=document.getElementById('pinLogin').value||'';if(pinHash(v)!==localStorage.getItem('bahar_admin_pin')){toast(t().wrongPin);return}adminLogged=true;renderAdmin()}
function logoutAdmin(){adminLogged=false;editingId=null;renderAdmin()}
function showChangePin(){document.getElementById('adminBody').innerHTML='<div class="adminLogin"><h3>'+t().changePin+'</h3><input id="newPin" class="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="'+t().newPin+'"><div style="margin-top:12px"><button class="primary" onclick="changePin()">'+t().savePin+'</button><button class="ghost" onclick="renderAdmin()">'+t().cancel+'</button></div></div>'}
function changePin(){const v=(document.getElementById('newPin').value||'').replace(/\D/g,'');if(v.length<4||v.length>8){toast(t().pinHelp);return}localStorage.setItem('bahar_admin_pin',pinHash(v));toast(t().pinChanged);renderAdmin()}
function newWork(){editingId='new';renderAdmin()}
function editWork(id){editingId=id;renderAdmin()}
function val(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function renderAdminForm(){
 const p=editingId==='new'?{titles:{},descriptions:{},cat:'painting',price:'',width:'',height:'',year:'',technique:'',status:'available'}:customProducts.find(x=>String(x.id)===String(editingId));
 if(!p){editingId=null;renderAdmin();return}
 const tr=p.titles||{},ds=p.descriptions||{};
 document.getElementById('adminBody').innerHTML='<div class="formGrid">'+
 '<div class="field"><label>'+t().titleFa+'</label><input id="fTitleFa" value="'+val(tr.fa)+'"></div><div class="field"><label>'+t().titleEn+'</label><input id="fTitleEn" value="'+val(tr.en)+'"></div>'+
 '<div class="field"><label>'+t().titleEs+'</label><input id="fTitleEs" value="'+val(tr.es)+'"></div><div class="field"><label>'+t().titleTr+'</label><input id="fTitleTr" value="'+val(tr.tr)+'"></div>'+
 '<div class="field full2"><label>'+t().descFa+'</label><textarea id="fDescFa">'+val(ds.fa)+'</textarea></div><div class="field full2"><label>'+t().descEn+'</label><textarea id="fDescEn">'+val(ds.en)+'</textarea></div>'+
 '<div class="field full2"><label>'+t().descEs+'</label><textarea id="fDescEs">'+val(ds.es)+'</textarea></div><div class="field full2"><label>'+t().descTr+'</label><textarea id="fDescTr">'+val(ds.tr)+'</textarea></div>'+
 '<div class="field"><label>'+t().category+'</label><select id="fCat">'+['painting','urban','nature','other'].map(c=>'<option value="'+c+'" '+(p.cat===c?'selected':'')+'>'+t().categories[c]+'</option>').join('')+'</select></div>'+
 '<div class="field"><label>'+t().status+'</label><select id="fStatus">'+['available','reserved','sold'].map(s=>'<option value="'+s+'" '+(p.status===s?'selected':'')+'>'+statusLabel(s)+'</option>').join('')+'</select></div>'+
 '<div class="field"><label>'+t().price+'</label><input id="fPrice" type="number" step="0.01" min="0" value="'+val(p.price)+'"></div><div class="field"><label>'+t().yearField+'</label><input id="fYear" inputmode="numeric" value="'+val(p.year)+'"></div>'+
 '<div class="field"><label>'+t().width+'</label><input id="fWidth" type="number" min="0" value="'+val(p.width)+'"></div><div class="field"><label>'+t().height+'</label><input id="fHeight" type="number" min="0" value="'+val(p.height)+'"></div>'+
 '<div class="field full2"><label>'+t().techniqueField+'</label><input id="fTechnique" value="'+val(p.technique)+'"></div>'+
 '<div class="field full2 mediaPick"><label>'+t().image+'</label><input id="fImage" type="file" accept="image/*" onchange="previewImage(this)"><img id="imgPreview" class="preview"></div>'+
 '<div class="field full2 mediaPick"><label>'+t().video+'</label><input id="fVideo" type="file" accept="video/*"></div>'+
 '</div><p class="help">'+t().mediaHint+'</p><div class="adminToolbar"><button class="primary" onclick="saveWork()">'+(editingId==='new'?t().saveWork:t().updateWork)+'</button><button class="ghost" onclick="editingId=null;renderAdmin()">'+t().cancel+'</button></div>';
}
function previewImage(inp){const f=inp.files&&inp.files[0],img=document.getElementById('imgPreview');if(!f){img.classList.remove('show');return}const u=URL.createObjectURL(f);mediaUrls.push(u);img.src=u;img.classList.add('show')}
async function saveWork(){
 const titles={fa:document.getElementById('fTitleFa').value.trim(),en:document.getElementById('fTitleEn').value.trim(),es:document.getElementById('fTitleEs').value.trim(),tr:document.getElementById('fTitleTr').value.trim()};
 if(!titles.fa&&!titles.en){toast(t().required);return}
 const descriptions={fa:document.getElementById('fDescFa').value.trim(),en:document.getElementById('fDescEn').value.trim(),es:document.getElementById('fDescEs').value.trim(),tr:document.getElementById('fDescTr').value.trim()};
 const old=editingId==='new'?null:customProducts.find(x=>String(x.id)===String(editingId));
 const id=old?old.id:'c'+Date.now();
 const width=document.getElementById('fWidth').value,height=document.getElementById('fHeight').value;
 const p={id,base:false,titles,descriptions,cat:document.getElementById('fCat').value,status:document.getElementById('fStatus').value,price:Number(document.getElementById('fPrice').value||0),width,height,size:(width||'?')+' × '+(height||'?')+' cm',year:document.getElementById('fYear').value.trim(),technique:document.getElementById('fTechnique').value.trim(),imageKey:old&&old.imageKey?old.imageKey:'img:'+id,videoKey:old&&old.videoKey?old.videoKey:'vid:'+id};
 const img=document.getElementById('fImage').files&&document.getElementById('fImage').files[0],vid=document.getElementById('fVideo').files&&document.getElementById('fVideo').files[0];
 if(img)await putMedia(p.imageKey,img);if(vid)await putMedia(p.videoKey,vid);
 if(old)customProducts=customProducts.map(x=>String(x.id)===String(id)?p:x);else customProducts.push(p);
 localStorage.setItem('bahar_custom_products',JSON.stringify(customProducts));editingId=null;toast(t().saved);renderAdmin();render()
}
async function deleteWork(id){if(!confirm(t().confirmDelete))return;const p=customProducts.find(x=>String(x.id)===String(id));if(p){await deleteMedia(p.imageKey);await deleteMedia(p.videoKey)}customProducts=customProducts.filter(x=>String(x.id)!==String(id));localStorage.setItem('bahar_custom_products',JSON.stringify(customProducts));cart=cart.filter(x=>String(x)!==String(id));likes=likes.filter(x=>String(x)!==String(id));localStorage.setItem('bahar_cart',JSON.stringify(cart));localStorage.setItem('bahar_likes',JSON.stringify(likes));toast(t().deleted);renderAdmin();render();updateCart()}

function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2100)}
applyLanguage();
</script>
</body></html>
